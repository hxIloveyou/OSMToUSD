# Pipeline preset — Taipei UE release (CityUsd layout v0.2)

scene:
  id_pattern: "taibei_ue_{timestamp}"

frame:
  origin_wgs84:
    longitude: 121.532933
    latitude: 25.047453
    height_m: 0.0
  projection: utm
  utm_epsg: 32651
  extent:
    mode: auto
    pad_deg: 0.005
    allow_disjoint: false
    on_relation:
      containment: use_smaller
      partial_overlap: warn
      disjoint: fail

inputs:
  osm:
    path: data/osm/taibei.osm.pbf
    clip_to_extent: true
  dem:
    path: data/rasters/cliptb.tif
    optional: false
  ortho:
    path: data/rasters/taibei.tif
    optional: true
  asset_library:
    path: data/AssetLibrary
  scene_description:
    path: data/uploads/demo_overlay_full_description.json
    optional: true

output:
  dir: output/ScenePackages
  layout: cityusd_v1

pipeline:
  - step: terrain
    config_ref: configs/terrain_default.json

  - step: osm_city_usd
    depends_on: [resolve_extent, terrain]
    config_ref: configs/osm_taibei_ue.json

  - step: osm_labels
    depends_on: [osm_city_usd]
    config_ref: configs/osm_labels_sharded.json

  - step: nav_pgm
    depends_on: [resolve_extent, osm_city_usd]
    config_ref: configs/nav_pgm_osm_only.json

  - step: overlay
    depends_on: [osm_city_usd]
    config_ref: configs/overlay_default.json

  - step: assemble_world
    depends_on: [terrain, osm_city_usd, nav_pgm, osm_labels]
    config_ref: configs/world_cityusd_v1.json

  - step: package_zip
    depends_on: [assemble_world]
    config_ref: configs/package_zip_default.json

runtime:
  on_step_fail: stop
  resume: false
  write_intermediate_configs: true

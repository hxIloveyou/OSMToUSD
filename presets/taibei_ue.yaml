# Pipeline preset — Taipei UE (SceneData layout)

scene:
  id: taibei_ue
  title: Taipei UE release
  id_pattern: "taibei_ue_{timestamp}"

frame:
  origin_wgs84:
    longitude: 121.532933
    latitude: 25.047453
    height_m: 0.0
  projection: utm
  utm_epsg: 32651
  extent:
    mode: auto
    pad_deg: 0.005
    allow_disjoint: false
    on_relation:
      containment: use_smaller
      partial_overlap: warn
      disjoint: fail

inputs:
  osm:
    path: osm/taibei.osm.pbf
    clip_to_extent: true
  dem:
    path: dem/cliptb.tif
    optional: false
  ortho:
    path: imagery/taibei.tif
    optional: true
  asset_library:
    path: tools/assets/AssetLibrary
  scene_description:
    path: uploads/demo_overlay_full_description.json
    optional: true

output:
  layout: cityusd_v1
  # dir omitted → SceneData/{scene.id}/output

pipeline:
  - step: terrain
    config_ref: configs/terrain_default.json

  - step: osm_city_usd
    depends_on: [resolve_extent, terrain]
    config_ref: configs/osm_taibei_ue.json

  - step: osm_labels
    depends_on: [osm_city_usd]
    config_ref: configs/osm_labels_sharded.json

  - step: nav_pgm
    depends_on: [resolve_extent, osm_city_usd]
    config_ref: configs/nav_pgm_osm_only.json

  - step: nav2_nature
    depends_on: [resolve_extent, terrain]
    config_ref: configs/nav2_nature_default.json

  - step: overlay
    depends_on: [osm_city_usd]
    config_ref: configs/overlay_default.json

  - step: assemble_world
    depends_on: [terrain, osm_city_usd, nav_pgm, nav2_nature, osm_labels]
    config_ref: configs/world_cityusd_v1.json

  - step: package_zip
    depends_on: [assemble_world]
    config_ref: configs/package_zip_default.json

runtime:
  on_step_fail: stop
  resume: false
  write_intermediate_configs: true
  backup_output_before_run: true
  backup_previous_packages: false
  backup_dir: backups
  backup_exclude:
    - "**/*.zip"
    - "*.zip"
